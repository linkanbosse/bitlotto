name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross compiler and emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
      - name: Test hasher on x86-64 (portable C)
        run: |
          gcc -O3 -Wall -o test_x86 app/src/test-native/test_sha256.c
          ./test_x86
      - name: Test hasher on aarch64 (ARMv8 SHA2 + portable, emulated)
        run: |
          aarch64-linux-gnu-gcc -O3 -Wall -static -march=armv8-a+crypto -o test_arm app/src/test-native/test_sha256.c
          qemu-aarch64 -cpu max ./test_arm

  build:
    needs: native-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BitLotto-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitLotto-apk
          path: out/*.apk

      - name: Publish release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BitLotto build ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
